version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: dris-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:////app/data/dris.db
      - GEOJSON_PATH=/app/data/geojson/india_districts.json
      - CACHE_DIR=/app/data/cache
      - MODEL_DIR=/app/ml/models
      - CORS_ORIGINS=["http://localhost", "http://localhost:80", "http://localhost:5173", "http://127.0.0.1"]
      - ALERT_MODE=console
      - DEMO_MODE=false
      - ADMIN_TOKEN=dris-super-secret-admin-token
    volumes:
      - dris-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - dris-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: dris-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - dris-network

networks:
  dris-network:
    driver: bridge

volumes:
  dris-data:
    driver: local
